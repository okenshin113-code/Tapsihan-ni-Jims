<title>Tapsihan ni Jim's</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first till app. Sticky masthead with today's takings, big tap tiles for orders,
   a bottom tab bar (Sell, Stock, Reports, Menu) and sheets that slide over for carts and edits. */
:root {
  --bg: #F1F2EF;
  --surface: #FFFFFF;
  --surface-2: #E7E9E3;
  --ink: #1C1A18;
  --muted: #5E5B55;
  --line: #D6D8D1;
  --accent: #C8301D;
  --on-accent: #FFFFFF;
  --ok: #17703F;
  --ok-bg: #DCF0E3;
  --warn: #86500A;
  --warn-bg: #FAE8C6;
  --bad: #A5201A;
  --bad-bg: #F8D9D5;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --tabh: calc(62px + env(safe-area-inset-bottom, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --surface: #212020; --surface-2: #2C2A28; --ink: #F1EEE9; --muted: #AAA59D; --line: #3B3936;
    --accent: #F0634E; --on-accent: #1C0A06;
    --ok: #5ED08D; --ok-bg: #16301F; --warn: #F2B955; --warn-bg: #35280F; --bad: #FF8F84; --bad-bg: #3B1B18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161514; --surface: #212020; --surface-2: #2C2A28; --ink: #F1EEE9; --muted: #AAA59D; --line: #3B3936;
  --accent: #F0634E; --on-accent: #1C0A06;
  --ok: #5ED08D; --ok-bg: #16301F; --warn: #F2B955; --warn-bg: #35280F; --bad: #FF8F84; --bad-bg: #3B1B18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.4;
  padding-left: var(--gl); padding-right: var(--gr);
  padding-block: 0 calc(var(--tabh) + 96px);
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
body.locked { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; }

/* masthead */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-left: calc(-1 * var(--gl)); margin-right: calc(-1 * var(--gr));
  padding: 12px var(--gr) 10px var(--gl); background: var(--bg); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand { min-width: 0; }
.brand h1 {
  margin: 0; font-family: var(--display); font-stretch: 78%; font-weight: 850; font-size: 27px; line-height: 1;
  letter-spacing: .01em; text-transform: uppercase; text-wrap: balance;
}
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.today { text-align: right; flex: none; }
.today small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.today b { display: block; font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.today span { color: var(--muted); font-size: 12px; }

main { padding-top: 16px; }
#banner { display: grid; gap: 8px; }
#banner:not(:empty) { margin-top: 12px; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }
.note.info { background: var(--surface-2); color: var(--ink); }
.note button { margin-left: 6px; }
h2.sec {
  margin: 22px 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700;
  display: flex; align-items: center; gap: 10px;
}
h2.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
h2.sec { scroll-margin-top: 88px; }
.jump { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 4px; }
.jump .btn { flex: none; white-space: nowrap; }

/* date control */
.datebtn { margin-top: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; min-height: 36px; font-size: 13px; font-weight: 600; max-width: 100%; text-align: left; }
.datebtn::after { content: " ▾"; color: var(--muted); }
.datebtn:disabled { opacity: 1; cursor: default; background: transparent; border-color: transparent; padding-left: 0; color: var(--muted); }
.datebtn:disabled::after { content: ""; }
.datebtn.back { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.datebtn.back::after { color: var(--on-accent); }
.note.back { background: var(--accent); color: var(--on-accent); }
.note.back .btn { color: var(--ink); margin-top: 6px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pills button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 42px; font-weight: 600; }
.pills button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.range { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.rng { margin: 10px 2px 0; color: var(--muted); font-size: 14px; font-weight: 600; }
.asof { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.asof label { font-weight: 600; }
.asof input { min-height: 42px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }

/* buttons & chips */
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; font-weight: 600; min-height: 44px;
}
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.btn.link { border-color: transparent; background: transparent; text-decoration: underline; padding: 4px 6px; min-height: 0; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 8px; font-weight: 600; min-height: 42px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* sell tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { position: relative; }
.tile-main {
  width: 100%; min-height: 96px; text-align: left; padding: 11px 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line);
  display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
}
.tile-main:active { transform: scale(.98); }
.tile.nostock .tile-main { opacity: .55; }
.tile.in .tile-main { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.t-name { font-family: var(--display); font-stretch: 80%; font-weight: 750; font-size: 18px; line-height: 1.05; text-transform: uppercase; letter-spacing: .015em; padding-right: 30px; text-wrap: balance; }
.t-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.t-price { font-family: var(--display); font-stretch: 82%; font-weight: 800; font-size: 25px; font-variant-numeric: tabular-nums; }
.t-price small { font-size: 14px; font-weight: 700; margin-right: 1px; color: var(--muted); }
.tile-minus {
  position: absolute; top: 6px; right: 6px; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 999px;
  border: 0; background: var(--accent); color: var(--on-accent); font-weight: 800; font-variant-numeric: tabular-nums;
}

/* fixed bars */
.cartbar {
  position: fixed; left: 0; right: 0; bottom: var(--tabh); z-index: 6;
  padding: 8px var(--gr) 8px var(--gl); background: var(--bg); border-top: 1px solid var(--line);
}
.cartbar .wrap { display: flex; align-items: center; gap: 12px; }
.cartbar .sum { flex: 1; min-width: 0; }
.cartbar .sum b { font-family: var(--display); font-stretch: 80%; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cartbar .sum span { color: var(--muted); margin-left: 8px; font-size: 14px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; height: var(--tabh);
  padding: 0 var(--gr) env(safe-area-inset-bottom, 0px) var(--gl); background: var(--surface); border-top: 1px solid var(--line);
}
.tabbar .wrap { display: grid; grid-template-columns: repeat(6, 1fr); height: 100%; }
.tabbar button {
  border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 12px; font-weight: 700; letter-spacing: .02em; position: relative;
}
.tabbar button[aria-current="page"] { color: var(--accent); }
.tabbar button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar .dot { position: absolute; top: 8px; left: calc(50% + 8px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11px; line-height: 17px; text-align: center; }

/* lists */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: 12px 14px; }
.list > li + li { border-top: 1px solid var(--line); }
.srow .s-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.s-name { font-weight: 700; font-size: 16px; }
.s-sub { color: var(--muted); font-size: 13px; }
.s-qty { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.s-qty b { font-family: var(--display); font-stretch: 82%; font-weight: 800; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.s-qty b.neg { color: var(--bad); }
.s-acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.mrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: transparent; padding: 0; }
.mrow .m-main { flex: 1; min-width: 0; }
.mrow .m-name { font-weight: 700; }
.mrow .m-sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.mrow .m-price { font-family: var(--display); font-stretch: 82%; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
li.off .m-name, li.off .m-price { opacity: .55; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; font-size: 16px; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }

/* reports */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.stat small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.stat b { display: block; font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat span { color: var(--muted); font-size: 12px; }
.split { height: 10px; border-radius: 5px; overflow: hidden; display: flex; background: var(--surface-2); margin: 8px 0 6px; }
.split i { display: block; height: 100%; }
.split i.c { background: var(--ink); }
.split i.g { background: var(--accent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend b { color: var(--ink); }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.rank { display: grid; gap: 10px; padding: 14px; }
.rank .r { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.rank .r-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.rank .r-val { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.rank .r-bar { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.rank .r-bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.chartbox { padding: 14px 14px 10px; }
.bars { display: flex; gap: 3px; align-items: stretch; height: 160px; }
.bar { flex: 1; min-width: 0; display: grid; grid-template-rows: 1fr 18px; }
.plot { position: relative; }
.bf { position: absolute; left: 0; right: 0; bottom: 0; height: var(--h); min-height: 2px; background: var(--ink); border-radius: 3px 3px 0 0; }
.bf.zero { min-height: 0; height: 0; }
.bv { position: absolute; left: -4px; right: -4px; bottom: calc(var(--h) + 3px); text-align: center; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bl { font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap; overflow: visible; }
.axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
.panel details { margin: 0; border: 0; padding: 0; }
.dsum { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; list-style: none; min-height: 40px; }
.dsum::-webkit-details-marker { display: none; }
.dsum::after { content: "▾"; color: var(--muted); order: 3; }
.dsum > b { margin-left: auto; font-size: 18px; }
details[open] > .dsum::after { content: "▴"; }
.dbody { padding-top: 6px; }
.dbody p { margin: 6px 0; overflow-wrap: anywhere; }
.rem { display: flex; flex-wrap: wrap; gap: 6px; }
.sale { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.sale .s-items { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.sale .s-total { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.sale.void .s-items, .sale.void .s-total { text-decoration: line-through; opacity: .55; }

.modrow { margin: -2px 0 6px; padding: 8px 10px; background: var(--bg); border-radius: 8px; }
.modline { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 3px 0; font-weight: 600; font-size: 14px; }
.modline .msub { color: var(--muted); font-weight: 400; font-size: 12px; }
.modline .stepper button { width: 34px; height: 34px; background: var(--surface); }
.modrow + .cline { border-top: 1px solid var(--line); }
/* sheets */
#sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
#sheet[hidden] { display: none; }
.backdrop { position: absolute; inset: 0; background: rgba(10, 8, 6, .5); border: 0; padding: 0; }
.sheet-panel {
  position: relative; width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 16px 16px 0 0; border: 1px solid var(--line); border-bottom: 0;
  padding: 18px max(18px, var(--gr)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, var(--gl));
}
.sheet-panel h2 { margin: 0 0 4px; font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 24px; text-transform: uppercase; }
.sheet-panel .lead { margin: 0 0 14px; color: var(--muted); }
.field { display: grid; gap: 5px; margin: 12px 0; font-weight: 600; font-size: 14px; }
.field input, .field select {
  width: 100%; min-height: 46px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-weight: 500; font-size: 17px;
}
.field input.big { font-size: 28px; font-family: var(--display); font-stretch: 85%; font-weight: 800; min-height: 58px; font-variant-numeric: tabular-nums; }
.field .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; gap: 10px; margin-top: 18px; }
.actions .btn { flex: 1; }
.cline { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 10px 0; }
.cline + .cline { border-top: 1px solid var(--line); }
.tiraIn { width: 96px; min-height: 46px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.cline .c-name { font-weight: 700; }
.cline .c-sub { color: var(--muted); font-size: 13px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; font-weight: 700; }
.stepper b { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; font-size: 17px; }
.totalline { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 4px; }
.totalline b { font-family: var(--display); font-stretch: 80%; font-weight: 850; font-size: 34px; font-variant-numeric: tabular-nums; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.quick button { flex: 1; min-width: 56px; }
.change { margin-top: 8px; font-weight: 700; }
.change.short { color: var(--bad); }
.ing { display: grid; grid-template-columns: 1fr 76px 40px; gap: 6px; margin-bottom: 6px; }
.ing select, .ing input { min-height: 44px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); width: 100%; font-size: 16px; }
.ing button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; font-size: 20px; }
fieldset { border: 0; padding: 0; margin: 14px 0 0; min-width: 0; }
legend { font-weight: 600; font-size: 14px; padding: 0; margin-bottom: 6px; }
.check { display: flex; align-items: center; gap: 10px; margin: 14px 0; font-weight: 600; }
.check input { width: 22px; height: 22px; }
details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
summary { font-weight: 700; cursor: pointer; min-height: 32px; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabh) + 84px); z-index: 30;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; max-width: calc(100% - 32px); text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);

@media (prefers-reduced-motion: no-preference) {
  .sheet-panel { animation: rise .18s ease-out; }

}
@media (min-width: 640px) {

  /* ---------- expected sales (forecast) ----------
     Looks at the same weekday over the last 8 weeks (recent weeks count more).
     Days with no sales are skipped, so a day you were closed does not pull the number down.
     With fewer than 2 matching days it falls back to the average of the last 28 days. */
  function forecastFor(dateStr) {
    var tgt = dparse(dateStr); if (isNaN(tgt)) return null;
    var wd = new Date(tgt).getDay(), today = dparse(todayStr());
    var from = dayMs(todayStr(), -56), days = {};
    S.sales.forEach(function (sl) {
      if (sl.voided || sl.ts < from) return;
      var k = dstr(sl.ts); if (dparse(k) >= today) return;
      var d = days[k] || (days[k] = { t: dparse(k), total: 0, orders: 0, use: {} });
      d.total += sl.total; d.orders += 1;
      (sl.lines || []).forEach(function (l) { var u = lineUseAbs(l); for (var q in u) d.use[q] = (d.use[q] || 0) + u[q]; });
    });
    var all = Object.keys(days).map(function (k) { return days[k]; });
    var pick = all.filter(function (d) { return new Date(d.t).getDay() === wd; }), basis = "same weekday";
    if (pick.length < 2) { pick = all.filter(function (d) { return d.t >= dayMs(todayStr(), -28); }); basis = "recent days"; }
    if (!pick.length) return null;
    var W = 0, sum = 0, ord = 0, use = {}, hi = 0, lo = Infinity;
    pick.forEach(function (d) {

      W += w; sum += d.total * w; ord += d.orders * w;
      for (var q in d.use) use[q] = (use[q] || 0) + d.use[q] * w;

  function forecastCard(f, label, actual) {
    var h = '<div class="stat"><small>' + esc(label) + '</small><b>' + money(Math.round(f.sales / 5) * 5) + '</b><span>about ' + Math.max(1, Math.round(f.orders)) + ' orders</span>';
    if (actual != null) {
      var pct = f.sales > 0 ? Math.min(100, Math.round(actual / f.sales * 100)) : 0;
      h += '<div class="split"><i class="c" style="width:' + pct + '%"></i></div><span>' + money(actual) + ' so far · ' + pct + '%' + (actual > f.sales ? ' (beat it!)' : '') + '</span>';
    } else h += '<br><span>usually ' + money(f.lo) + ' to ' + money(f.hi) + '</span>';
    return h + '</div>';
  }
  function prepList(f, soldToday) {
    var need = {}, k;
    for (k in f.use) need[k] = Math.max(0, f.use[k] - ((soldToday && soldToday[k]) || 0));
    var rows = Object.keys(need).filter(function (k2) { return stockById(k2) && need[k2] >= 0.5; })
      .sort(function (a, b) { return need[b] - need[a]; }).slice(0, 12);
    if (!rows.length) return "";

      var st = stockById(k2), exp = Math.ceil(need[k2] - 1e-9), have = Math.max(0, S.derived.touched[k2] ? S.derived.onHand[k2] : 0);
      var add = Math.max(0, exp - have), chip = add > 0 ? '<span class="chip bad">add ' + qf(add) + '</span>' : '<span class="chip ok">enough</span>';

  function forecastPanel() {

  /* ---------- calculator ---------- */
  var CALC_OPS = "+−×÷";
  S.calc = { expr: "", done: false, prev: "", hist: [] };
  function calcFmt(n) {
    if (!isFinite(n)) return "Error";
    var r = Math.round(n * 1e10) / 1e10;
    return r.toLocaleString("en-PH", { maximumFractionDigits: 10 });
  }
  function calcEval(src) {
    // returns a number, or null for an empty expression, or throws "div0" / "bad"
    var e = src.replace(/[+−×÷]+$/, "");
    if (!e) return null;
    var toks = e.match(/\d+\.?\d*|\.\d+|[+−×÷%]/g) || [], i = 0;
    if (toks.join("") !== e) throw "bad";
    function num_() {
      var t = toks[i];
      if (t === undefined || !/^[\d.]/.test(t)) throw "bad";
      i++; var v = parseFloat(t), pct = false;
      while (toks[i] === "%") { v = v / 100; i++; pct = true; }
      return { v: v, pct: pct };
    }
    function factor() { var t = toks[i]; if (t === "−") { i++; var f = factor(); return { v: -f.v, pct: f.pct }; } var r = num_(); return typeof r === "number" ? { v: r, pct: false } : r; }
    function term() {
      var a = factor(), n = 1;
      while (toks[i] === "×" || toks[i] === "÷") {
        var op = toks[i++], b = factor(); n++;
        if (op === "÷") { if (b.v === 0) throw "div0"; a = { v: a.v / b.v, pct: false }; } else a = { v: a.v * b.v, pct: false };
      }
      return { v: a.v, pct: a.pct && n === 1 };
    }
    var left = term();
    while (toks[i] === "+" || toks[i] === "−") {
      var o = toks[i++], r = term(), rv = r.pct ? left.v * r.v : r.v;
      left = { v: o === "+" ? left.v + rv : left.v - rv, pct: false };
    }
    if (i < toks.length) throw "bad";
    return left.v;
  }
  function calcShow(x) { return String(x).replace(/([+−×÷])/g, " $1 "); }
  function calcPress(k) {
    var c = S.calc, last = c.expr.slice(-1), isOp = CALC_OPS.indexOf(last) >= 0 && last !== "";

    h += '<label class="field"><span>' + label + ' <span class="hint">(' + esc(s.unit || "pc") + ')</span></span><input class="big" id="qtyIn" inputmode="decimal" placeholder="0" value="' + esc(keep.qty || "") + '"></label>';
    h += '<label class="field"><span>Note <span class="hint">(optional)</span></span><input id="noteIn" maxlength="80" placeholder="' + (mode === "in" ? "e.g. From the market" : mode === "waste" ? "e.g. Spoiled, dropped" : "e.g. Closing tira") + '" value="' + esc(keep.note || "") + '"></label>';
    h += '<div class="actions"><button class="btn" data-act="close" type="button">Cancel</button><button class="btn primary" data-act="save-move" type="button">Save ' + title.toLowerCase() + "</button></div>";

      h += '<details><summary>Item settings</summary><label class="field"><span>Name</span><input id="sName" value="' + esc(s.name) + '"></label><label class="field"><span>Group</span><input id="sCat" value="' + esc(s.cat || "") + '" placeholder="e.g. Silogs"></label>' +
        '<div class="row2"><label class="field"><span>Unit</span><input id="sUnit" value="' + esc(s.unit || "") + '" placeholder="serving, pc, kg"></label><label class="field"><span>Reorder at</span><input id="sReorder" inputmode="decimal" value="' + esc(s.reorder || 0) + '"></label></div>' +
        '<label class="field"><span>Cost per unit (₱) <span class="hint">Used for the profit estimate.</span></span><input id="sCost" inputmode="decimal" value="' + esc(s.cost || 0) + '"></label>' +
        '<div class="actions"><button class="btn" data-act="save-stock" type="button">Save settings</button></div></details>';

  }
  function saveMove() {
    if (!guardWrite()) return;
    var s = stockById(S.sheet.id), mode = S.sheet.mode;
    var q = parseNum($("#qtyIn").value), note = $("#noteIn").value.trim();
    if (!(q >= 0) || (mode !== "count" && !(q > 0))) { toast("Enter a number greater than 0.", true); return; }
    var ts = stamp(), ref = ledgerAt(S.events, ts), cur = ref.on[s.id] || 0, qty, kind, rec;
    if (mode === "in") { qty = q; kind = "delivery"; }
    else if (mode === "waste") { qty = -q; kind = "waste"; }
    else { qty = num(q - cur); kind = "adjust"; if (qty === 0 && ref.touched[s.id]) { closeSheet(); toast("Already matches."); return; } }
    rec = { ts: ts, at: Date.now(), stockId: s.id, qty: qty, kind: kind, note: note };
    if (mode === "count") rec.counted = q;
    var p = S.db.collection("moves").add(rec);
    closeSheet(); toast("Saved · " + s.name + (backdated() ? " · " + dlabel(ts) : "")); p.catch(fail);
  }
  function saveStock() {
    if (!guardWrite()) return;
    var name = $("#sName").value.trim(), unit = $("#sUnit").value.trim() || "pc";
    var reorder = parseNum($("#sReorder").value || 0), cost = parseNum($("#sCost").value || 0);
    if (!name) { toast("Give the item a name.", true); return; }
    if (!(reorder >= 0) || !(cost >= 0)) { toast("Reorder level and cost must be numbers.", true); return; }
    S.db.doc("stock/" + S.sheet.id).update({ name: name, cat: ($("#sCat").value.trim() || "Other"), unit: unit, reorder: reorder, cost: cost }).then(function () { toast("Settings saved"); }).catch(fail);
    closeSheet();
  }
  function newStockSheet() {
    S.sheet = { type: "newstock", focus: true };
    openSheet('<h2>New stock item</h2><p class="lead">Something you buy and use up, like rice or tapa.</p>' +
      '<label class="field"><span>Name</span><input id="sName" placeholder="e.g. Cooking oil"></label><label class="field"><span>Group</span><input id="sCat" placeholder="e.g. Extras"></label>' +
      '<div class="row2"><label class="field"><span>Unit</span><input id="sUnit" placeholder="serving, pc, liter"></label><label class="field"><span>Reorder at</span><input id="sReorder" inputmode="decimal" value="0"></label></div>' +
      '<label class="field"><span>Cost per unit (₱)</span><input id="sCost" inputmode="decimal" value="0"></label>' +
      '<div class="actions"><button class="btn" data-act="close" type="button">Cancel</button><button class="btn primary" data-act="create-stock" type="button">Add item</button></div>');
  }
  function createStock() {
    if (!guardWrite()) return;
    var name = $("#sName").value.trim(), unit = $("#sUnit").value.trim() || "pc";
    var reorder = parseNum($("#sReorder").value || 0), cost = parseNum($("#sCost").value || 0);

    if (!(reorder >= 0) || !(cost >= 0)) { toast("Reorder level and cost must be numbers.", true); return; }

  }

/* ---------- MENU ---------- */

  function manualHtml() {

      ["1. Taking an order", ["Go to the <b>Sell</b> tab.", "Tap the dish once for each order. Tap it again to add another one. The red number on the dish shows how many are in the order.", "Added too many? Tap the red <b>−</b> button on the dish to remove one.", "Tap <b>Review order</b> at the bottom of the screen.", "<b>Every meal comes with 1 egg and 1 rice.</b> The egg is taken off your Egg stock automatically for each order. The rice is not counted in stock, but its cost is counted in your profit (see 15)."]],

    /* ---------- REPORTS ---------- */
  function bars(items, every, showVals) {
    var max = Math.max.apply(null, items.map(function (i) { return i.v; }).concat([1]));
    return '<div class="bars">' + items.map(function (i, ix) {
      var p = Math.round(i.v / max * 100);
      return '<div class="bar" title="' + esc(i.t) + '"><div class="plot"><div class="bf' + (i.v ? "" : " zero") + '" style="--h:' + p + '%"></div>' + (showVals && i.v ? '<span class="bv" style="--h:' + p + '%">' + short(i.v) + "</span>" : "") + '</div><span class="bl">' + (ix % every === 0 ? esc(i.l) : "") + "</span></div>";
    }).join("") + "</div>";
  }
  function getRange() {
    var t = todayStr(), a, b;
    if (S.period === "today") a = b = t;
    else if (S.period === "yest") a = b = dstr(dayMs(t, -1));
    else if (S.period === "7d") { a = dstr(dayMs(t, -6)); b = t; }
    else if (S.period === "30d") { a = dstr(dayMs(t, -29)); b = t; }
    else { a = S.from || t; b = S.to || t; }
    if (a > b) { var x = a; a = b; b = x; }
    if (b > t) b = t;
    if (a > t) a = t;
    var n = Math.round((dparse(b) - dparse(a)) / 864e5) + 1, clamped = false;
    if (n > 62) { a = dstr(dayMs(b, -61)); n = 62; clamped = true; }
    return { a: a, b: b, n: n, start: dparse(a), end: dayMs(b, 1), clamped: clamped };
  }
  function rangeLabel(r) { return r.a === r.b ? dlabel(r.start) : dlabel(r.start) + " to " + dlabel(dparse(r.b)); }
  function daySummary(r) {
    var blocks = "", first = true;
    for (var i = r.n - 1; i >= 0; i--) {
      var d0 = dayMs(r.a, i), d1 = dayMs(r.a, i + 1) - 1;
      var sales = salesBetween(d0, d1 + 1);
      var wastes = S.moves.filter(function (m) { return m.kind === "waste" && m.ts >= d0 && m.ts <= d1; });
      if (!sales.length && !wastes.length) continue;
      var total = sales.reduce(function (a, s) { return a + s.total; }, 0);
      var cash = sumPay(sales, "cash"), gcash = sumPay(sales, "gcash"), utg = sumPay(sales, "utang");
      var wmap = {}, wval = 0;
      wastes.forEach(function (m) { var q = -m.qty, st = stockById(m.stockId); wmap[m.stockId] = (wmap[m.stockId] || 0) + q; if (st) wval += q * (Number(st.cost) || 0); });
      var wtxt = Object.keys(wmap).map(function (k) { var st = stockById(k); return esc(stockName(k)) + " " + qf(wmap[k]) + (st && st.unit ? " " + esc(st.unit) : ""); }).join(", ");
      var at = ledgerAt(S.events, d1), rem = S.stock.slice().sort(byOrder).filter(function (s) { return at.touched[s.id]; }).map(function (s) {

  function closeShop() {

      var cur = ref.on[st.id] || 0;

    });

    if ($("#resetIn").value.trim().toUpperCase() !== "RESET") { toast("Type RESET to confirm.", true); return; }
    if (!guardWrite()) return;
    var jobs = S.sales.map(function (s) { return "sales/" + s.id; }).concat(S.moves.map(function (m) { return "moves/" + m.id; })).concat(S.closes.map(function (c) { return "closes/" + c.id; })).concat(S.expenses.map(function (c) { return "expenses/" + c.id; })).concat(S.credits.map(function (c) { return "credits/" + c.id; }));
    closeSheet(); S.cart = {}; S.cash = 0; toast("Deleting " + jobs.length + " records…");
    (async function () {
      for (var i = 0; i < jobs.length; i += 10) await Promise.all(jobs.slice(i, i + 10).map(function (p) { return S.db.doc(p).delete(); }));
      toast("Done. Sales and stock history are cleared.");
    })().catch(function () { toast("Some records could not be deleted. Reopen the page and try again.", true); });
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act, id = b.dataset.id;
    switch (a) {
      case "tab": S.tab = b.dataset.tab; S.closeArm = false; S.tira = {}; S.voidArm = null; S.undoArm = null; S.expArm = null; window.scrollTo(0, 0); renderAll(); break;
      case "jump": var gt = document.getElementById("grp-" + b.dataset.g); if (gt) gt.scrollIntoView({ block: "start" }); break;
      case "add": var pr1 = addProblem(id); if (pr1) { toast("Can’t sell: " + pr1, true); break; } if (isClosedDay(dstr(workStart()))) { toast("The shop is closed. Reopen it on the Close tab.", true); break; } S.cart[id] = (S.cart[id] || 0) + 1; renderAll(); break;
      case "dec": if (S.cart[id] > 1) S.cart[id]--; else { delete S.cart[id]; delete S.mods[id]; } renderAll(); break;
      case "close-shop": if (!S.closeArm) { S.closeArm = true; renderAll(); break; } S.closeArm = false; closeShop(); break;
      case "reopen": reopenShop(); break;
      case "open-cart": showCart(); break;
      case "mod": var mo2 = S.mods[id] || (S.mods[id] = { nr: 0, ne: 0 }), kk = b.dataset.k, q2 = S.cart[id] || 0; mo2[kk] = Math.max(0, Math.min(q2, Math.min(mo2[kk] || 0, q2) + (+b.dataset.d))); renderAll(); refreshCartSheet(); break;
      case "cinc": var pr2 = addProblem(id); if (pr2) { toast("Can’t add more: " + pr2, true); break; } S.cart[id] = (S.cart[id] || 0) + 1; renderAll(); refreshCartSheet(); break;
      case "cdec": if (S.cart[id] > 1) S.cart[id]--; else { delete S.cart[id]; delete S.mods[id]; } renderAll(); if (!cartCount()) closeSheet(); else refreshCartSheet(); break;
      case "clear-cart": S.cart = {}; S.mods = {}; S.cash = 0; S.disc = 0; closeSheet(); renderAll(); break;
      case "pay": S.pay = b.dataset.pay; refreshCartSheet(); break;
      case "open-calc": calcSheet(); break;
      case "calc": calcPress(b.dataset.k); break;
      case "calc-use": var ch = S.calc.hist[Number(b.dataset.i)]; if (ch) { S.calc.expr = ch.r; S.calc.done = false; S.calc.prev = ""; S.calc.err = ""; calcRender(); } break;
      case "open-utang": utangSheet(b.dataset.who); break;
      case "pay-full": $("#payAmt").value = b.dataset.v; break;
      case "save-pay": saveUtangPay(); break;
      case "open-expense": expenseSheet(b.dataset.label || ""); break;
      case "exp-label": $("#expLabel").value = b.dataset.label; break;
      case "save-expense": saveExpense(); break;
      case "del-exp": delExpense(b.dataset.id); break;
      case "cash": S.cash = b.dataset.v === "exact" ? cartTotal() : parseNum(b.dataset.v); refreshCartSheet(); break;
      case "disc-pct": S.disc = num(cartSubtotal() * (+b.dataset.v) / 100); refreshCartSheet(); renderCartBar(); break;
      case "charge": charge(); break;
      case "close": closeSheet(); break;
      case "stk":
        var s = stockById(id); if (!s) break;
        S.sheet = { type: "stock", id: id, mode: b.dataset.mode, focus: true }; openSheet(stockSheetHtml(s, b.dataset.mode)); break;
      case "mode":
        var s2 = stockById(S.sheet.id); S.sheet.mode = b.dataset.mode;
        openSheet(stockSheetHtml(s2, b.dataset.mode, { qty: $("#qtyIn").value, note: $("#noteIn").value })); break;
      case "save-move": saveMove(); break;
      case "save-stock": saveStock(); break;
      case "new-stock": newStockSheet(); break;
      case "create-stock": createStock(); break;
      case "new-menu": menuSheet(null); break;
      case "edit-menu": menuSheet(S.menu.filter(function (m) { return m.id === id; })[0]); break;
      case "add-ing": if (S.stock.length) $("#recipe").insertAdjacentHTML("beforeend", ingRow(S.stock.slice().sort(byOrder)[0].id, 1)); break;
      case "rm-ing": b.closest(".ing").remove(); break;
      case "save-menu": saveMenu(); break;
      case "period":
        S.period = b.dataset.p; S.ordersMax = 12; S.voidArm = null;
        if (S.period === "custom") { var t0 = todayStr(); if (!S.from) S.from = dstr(dayMs(t0, -6)); if (!S.to) S.to = t0; }
        renderAll(); break;
      case "more-orders": S.ordersMax += 20; renderAll(); break;
      case "export": exportCsv(); break;
      case "void":
        if (S.voidArm !== id) { S.voidArm = id; renderAll(); break; }
        if (!guardWrite()) break;
        S.voidArm = null; S.db.doc("sales/" + id).update({ voided: true }).catch(fail); toast("Order voided"); break;
      case "undo-move":
        if (S.undoArm !== id) { S.undoArm = id; renderAll(); break; }
        if (!guardWrite()) break;
        S.undoArm = null; S.db.doc("moves/" + id).delete().catch(fail); toast("Entry undone"); break;
      case "open-date":
        if (!S.admin) { toast("Only the owner can change the date.", true); break; }
        dateSheet(); break;
      case "date-quick": $("#wdDate").value = dstr(dayStart(+b.dataset.d)); break;
      case "apply-date": applyDate(); break;
      case "date-today": S.workDate = ""; S.workTime = ""; renderAll(); toast("Back to today"); break;
      case "asof-now": S.asOf = ""; renderAll(); break;
      case "open-reset": if (S.admin) resetSheet(); break;
      case "do-reset": doReset(); break;

    }
  });
  document.addEventListener("input", function (e) {
    if (e.target.classList && e.target.classList.contains("tiraIn")) { S.tira[e.target.dataset.id] = e.target.value; if (S.closeArm) { S.closeArm = false; var cb = $('[data-act="close-shop"]'); if (cb) cb.textContent = "Close shop for today"; } }
    if (e.target.id === "whoIn") S.who = e.target.value;
    if (e.target.id === "cashIn") { S.cash = parseNum(e.target.value) || 0; updateChange(); }
    if (e.target.id === "discIn") {
      S.disc = Math.max(parseNum(e.target.value) || 0, 0);
      var st = $("#sheetTotal"); if (st) st.textContent = money(cartTotal());
      renderCartBar(); updateChange();
    }
  });
  document.addEventListener("change", function (e) {
    var id = e.target && e.target.id, v = e.target && e.target.value;
    if (id === "fromIn") { if (v) { S.from = v; S.ordersMax = 12; renderAll(); } }
    else if (id === "toIn") { if (v) { S.to = v; S.ordersMax = 12; renderAll(); } }
    else if (id === "asOfIn") { S.asOf = v || ""; renderAll(); }
    else if (id === "riceCostIn") {
      var rv = parseNum(v || 0); if (!(rv >= 0)) { toast("Enter an amount like 8.", true); return; }
      S.riceCost = rv;
      try { localStorage.setItem("tapsihan_off", JSON.stringify({ r: S.offR, e: S.offE, c: S.riceCost })); } catch (x) {}
      toast("Saved"); renderAll();
    }
    else if (id === "offRIn" || id === "offEIn") {
      var nv = parseNum(v); if (!(nv >= 0)) { toast("Enter an amount like 10.", true); return; }
      if (id === "offRIn") S.offR = nv; else S.offE = nv;
      try { localStorage.setItem("tapsihan_off", JSON.stringify({ r: S.offR, e: S.offE, c: S.riceCost })); } catch (x) {}
      toast("Saved"); renderAll();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.sheet) { closeSheet(); return; }
    if (!S.sheet || S.sheet.type !== "calc" || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key, map = { "*": "×", "x": "×", "X": "×", "/": "÷", "-": "−", "Enter": "=", "=": "=", "Backspace": "⌫", "Delete": "C", "c": "C", "C": "C" };
    var key = map[k] || k;
    if (/^[0-9.+%]$/.test(key) || "×÷−=⌫C".indexOf(key) >= 0 && key.length === 1) { e.preventDefault(); calcPress(key); }
  });

/* ---------- connect ---------- */
  renderAll();
  setInterval(function () { if (!document.hidden) renderHeader(); }, 60000);
  (async function connect() {
    var c = window.claude;
    var db = null, user = null, dl = null;
    try { if (c && c.use) { db = await c.use("db"); user = await c.use("user"); dl = await c.use("downloads"); } } catch (e) { db = null; }
    S.db = db; S.dl = dl; S.ready = true;
    if (user) {
      try { S.admin = !!((await user.canEdit()) || (await user.isOwner())); } catch (e) { S.admin = true; }
      try { var w = await user.can("data.write"); S.canWrite = w !== false; } catch (e) { S.canWrite = true; }
    }
    if (!db) { renderAll(); return; }
    var timer = setTimeout(function () { S.slow = true; renderAll(); }, 10000);
    ["menu", "stock", "sales", "moves", "closes", "expenses", "credits"].forEach(function (name) {
      db.collection(name).onSnapshot(function (snap) {
        S[name] = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
        S.loaded[name] = true;
        if (allLoaded()) clearTimeout(timer);
        renderAll();
      }, function (err) { S.err = (err && err.code) || "error"; renderAll(); });
    });
  })();
})();
</script>

</body></html>
